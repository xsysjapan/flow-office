; Development defaults. Xdebug can be enabled temporarily with XDEBUG_MODE=debug.
xdebug.mode=off
xdebug.start_with_request=trigger
xdebug.client_port=9003

; artisan serve uses the CLI SAPI, so enable OPcache for CLI as well.
; Timestamps remain enabled so source edits are detected immediately.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Laravel and Composer perform many path lookups.
realpath_cache_size=16M
realpath_cache_ttl=120
