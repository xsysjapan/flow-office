services:
  app:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspaces/flow-office:cached
      - /workspaces/flow-office/frontend/node_modules
      - /workspaces/flow-office/backend/vendor
      - /workspaces/flow-office/mcp/vendor
    working_dir: /workspaces/flow-office
    command: .devcontainer/start.sh
    ports:
      - "8000:8000"
      - "5173:5173"
      - "8090:8090"
    environment:
      - MICROSOFT_MOCK_INTERNAL_BASE_URL=http://mock-oidc:9000
      # E2E/ローカル開発でfreee/マネーフォワードの外部送信先をモックサーバーへ向ける
      # (backend/config/external_integrations.php参照。本番・検証環境では設定しないこと)。
      - FREEE_TOKEN_ENDPOINT=http://mock-freee:9001/public_api/token
      - FREEE_ATTENDANCE_API_ENDPOINT=http://mock-freee:9001/hr/api/v1/employees/{employee_id}/work_record_summaries/{year}/{month}
      - FREEE_EXPENSE_API_ENDPOINT=http://mock-freee:9001/api/1/deals
      - MF_EXPENSE_TOKEN_ENDPOINT=http://mock-moneyforward:9002/oauth/token
      - MF_EXPENSE_EX_TRANSACTIONS_ENDPOINT=http://mock-moneyforward:9002/api/external/v1/offices/{office_id}/office_members/{office_member_id}/ex_transactions
      - MF_EXPENSE_UPLOAD_RECEIPT_ENDPOINT=http://mock-moneyforward:9002/api/external/v1/offices/{office_id}/office_members/{office_member_id}/upload_receipt
      # 以下4つはscripts/start-ngrok.sh がホスト側のシェルでexportした状態で
      # `docker compose up`を起動した場合のみ渡される(値を書かない場合、docker composeは
      # ホスト側のシェルから同名の変数をそのまま渡す。ホスト側で未設定なら、空文字ではなく
      # コンテナ内でも未設定のままになり、ローカル既定値が使われる)。
      # frontend(Vite)はVITE_接頭辞のためprocess.envから自動的に読み込まれる。
      # MCP_PUBLIC_APP_URL/BACKEND_PUBLIC_APP_URLは.devcontainer/start.shが
      # mcp/backendの起動時にだけ参照する。
      - VITE_BASE_PATH
      - VITE_API_BASE_URL
      - FRONTEND_PUBLIC_APP_URL
      - BACKEND_PUBLIC_APP_URL
      - MCP_PUBLIC_APP_URL
    depends_on:
      mock-oidc:
        condition: service_started
      mock-freee:
        condition: service_started
      mock-moneyforward:
        condition: service_started
      db:
        condition: service_healthy

  # backend用のMySQL(本番同等のDBエンジンでの動作確認用)。dockerで起動する場合は
  # .devcontainer/start.shが初回のbackend/.env作成時にDB_CONNECTION=mysqlへ切り替え、
  # このサービスに接続する。docker経由でない通常起動(ホスト直接実行等)では
  # backend/.env.exampleの既定通りDB_CONNECTION=sqliteのままなので本サービスは使わない。
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: flow_office
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-oidc:
    build:
      context: ./mock-oidc
    ports:
      - "9000:9000"
    environment:
      # ログイン画面のユーザー選択肢をbackendのDBから取得する(mock-oidc/server.js参照)。
      # 未設定/取得失敗時は静的な一覧にフォールバックする。
      MOCK_USERS_API_URL: http://app:8000/api/dev/mock-users

  # E2E検証用のfreee APIモック(勤怠API・経費API送信の疎通確認用、mock-freee/server.js参照)。
  mock-freee:
    build:
      context: ./mock-freee
    ports:
      - "9001:9001"

  # E2E検証用のマネーフォワードクラウド経費APIモック(mock-moneyforward/server.js参照)。
  mock-moneyforward:
    build:
      context: ./mock-moneyforward
    ports:
      - "9002:9002"

volumes:
  mysql-data:
